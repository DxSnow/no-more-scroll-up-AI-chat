<!DOCTYPE html>
<html>
<head>
  <title>Generate ChatJumpo Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    .icons { display: flex; gap: 20px; align-items: end; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>ChatJumpo Icon Generator</h1>
  <p>Click each button to download the icon in that size.</p>

  <div class="icons">
    <div>
      <canvas id="c16" width="16" height="16"></canvas>
      <br><button onclick="download(16)">Download 16x16</button>
    </div>
    <div>
      <canvas id="c48" width="48" height="48"></canvas>
      <br><button onclick="download(48)">Download 48x48</button>
    </div>
    <div>
      <canvas id="c128" width="128" height="128"></canvas>
      <br><button onclick="download(128)">Download 128x128</button>
    </div>
  </div>

  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#8B5CF6"/>
          <stop offset="50%" style="stop-color:#EC4899"/>
          <stop offset="100%" style="stop-color:#F97316"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
      <rect x="18" y="52" width="52" height="18" rx="9" fill="rgba(255,255,255,0.25)"/>
      <rect x="58" y="84" width="52" height="18" rx="9" fill="white"/>
      <line x1="20" y1="27" x2="48" y2="27" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <polygon points="50,27 42,20 42,34" fill="white"/>
      <rect x="58" y="18" width="52" height="18" rx="9" fill="white"/>
    </svg>`;

    const sizes = [16, 48, 128];

    sizes.forEach(size => {
      const canvas = document.getElementById('c' + size);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const blob = new Blob([svg], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
      };
      img.src = url;
    });

    function download(size) {
      const canvas = document.getElementById('c' + size);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
