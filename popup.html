<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        padding: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #fff;
        border-bottom: 1px solid #333;
        padding-bottom: 12px;
      }
      .feature {
        margin-bottom: 16px;
        padding: 12px;
        background: #252525;
        border-radius: 8px;
        border-left: 3px solid #EC4899;
      }
      .feature-title {
        font-size: 14px;
        font-weight: 600;
        color: #8B5CF6;
        margin-bottom: 6px;
      }
      .feature-desc {
        font-size: 12px;
        color: #aaa;
        line-height: 1.5;
      }
      .shortcut {
        display: inline-block;
        background: #333;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        color: #fff;
      }
      .sites {
        font-size: 11px;
        color: #888;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #333;
      }
      .sites span {
        display: inline-block;
        background: #2d2d2d;
        padding: 2px 8px;
        border-radius: 4px;
        margin: 2px 4px 2px 0;
      }
    </style>
  </head>
  <body>
    <h1>ChatJump</h1>

    <div class="feature">
      <div class="feature-title">Question Navigator</div>
      <div class="feature-desc">
        No more scrolling! Click the <span class="shortcut">📋</span> button to see all your questions in a sidebar. Click any question to jump directly to it.
      </div>
    </div>

    <div class="sites">
      <strong>Supports:</strong>
      <span>ChatGPT</span>
      <span>Gemini</span>
      <span>DeepSeek</span>
    </div>
  </body>
</html>
